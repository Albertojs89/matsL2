<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objetivos del clan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  CÓMO EDITAR ESTE ARCHIVO (todo lo que cambias está en 1 sitio)  ║
  ╚══════════════════════════════════════════════════════════════════╝
  1) Busca el bloque  "CONFIGURACIÓN"  dentro de <script> (más abajo).
  2) TARGETS  → los objetivos (2 o 3 normalmente). Para cada uno:
        item         nombre del ítem
        image        ruta de la imagen del ítem (PNG con fondo transparente)
        character    nombre del personaje destinatario
        progress     porcentaje 0–100
        aura         color del brillo y de la barra (opcional, cualquier color CSS)
        startDate    fecha de inicio del objetivo (opcional): "2026-10-01" o "01/10/2026".
                     Muestra la fecha y los días que lleva en marcha.
        message      (opcional) texto libre para el panel de abajo. Si lo pones,
                     se muestra en vez de la lista y de la imagen.
        panelTitle   (opcional) título del panel. Por defecto "Materiales necesarios"
                     (con message no se muestra título salvo que lo pongas).
        materials    lista de materiales: [["id_material", cantidad], ...]
        materialsImage  (opcional) ruta de una imagen con los materiales.
                        Si la pones, se usa la imagen en vez de la lista.
  3) MATERIALS_CATALOG → catálogo de materiales básicos. Añade los que quieras:
        id_material: "Nombre que se verá"
  4) ARROWS → si quieres tus flechas PNG blancas, pon aquí sus rutas.
     Con null se usan unas flechas SVG blancas incluidas en este archivo.
  5) Colores, tamaños y velocidades → variables CSS al principio de <style> (:root).
-->

<style>
:root{
  /* ——— Colores ——— */
  --bg-top:#101b2b;
  --bg-bottom:#34353b;
  --text:#ffffff;
  --text-soft:rgba(255,255,255,.72);
  --gold:#e8b86d;
  /* la barra toma el color del aura de cada objetivo */
  --bar-track:color-mix(in srgb,var(--aura) 42%,#d9e3f2);
  --bar-fill-a:color-mix(in srgb,var(--aura) 72%,#000);
  --bar-fill-b:var(--aura);
  --panel:#1b0e0e;
  --panel-line:rgba(255,255,255,.06);
  --aura:#6aa8ff;           /* color por defecto del brillo del ítem */

  /* ——— Tamaños ——— */
  --card-width:560px;
  --item-size:240px;        /* alto/ancho máximo del ítem */
  --bar-height:46px;
  --bar-width:min(430px,80%);

  /* ——— Animaciones ——— */
  --float-time:5s;          /* subida/bajada del ítem */
  --float-distance:10px;    /* cuánto flota */
  --aura-time:3.6s;         /* pulso del brillo */
  --wave-time:5s;           /* velocidad de la ola de la barra */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--bg-top) 0%,#222836 55%,var(--bg-bottom) 100%) fixed;
  display:flex;justify-content:center;
  overflow-x:hidden;
}

.card{
  position:relative;z-index:1;
  width:100%;max-width:var(--card-width);
  min-height:100%;
  padding:clamp(28px,7vh,72px) 20px 48px;
  display:flex;flex-direction:column;align-items:center;
}

/* ——— Visor con flechas ——— */
.viewer{position:relative;width:100%}
.slide{position:relative;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}

/* resplandor ambiental detrás del ítem */
.halo{
  position:absolute;left:50%;top:-40px;width:min(980px,170vw);height:560px;
  transform:translateX(-50%);pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--aura) 22%,transparent),transparent 62%);
}
/* estrellas tenues del fondo */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.stars span{position:absolute;border-radius:50%;background:#fff;opacity:.06;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05}50%{opacity:.5}}

.arrow{
  position:absolute;top:calc(var(--item-size) / 2 - 8px);
  z-index:5;
  width:44px;height:64px;transform:translateY(-50%);
  background:none;border:0;cursor:pointer;color:#fff;
  display:grid;place-items:center;
  transition:transform .2s ease,opacity .2s ease;
  opacity:.85;
}
.arrow:hover{opacity:1}
.arrow.prev{left:0}
.arrow.next{right:0}
.arrow.prev:hover{transform:translateY(-50%) translateX(-4px)}
.arrow.next:hover{transform:translateY(-50%) translateX(4px)}
.arrow:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.arrow svg,.arrow img{width:100%;height:100%;display:block;object-fit:contain}
.arrow svg{fill:currentColor}
.arrow.hidden{display:none}

/* ——— Ítem flotante con aura ——— */
.item-stage{
  position:relative;
  width:var(--item-size);height:var(--item-size);
  display:grid;place-items:center;
  margin-bottom:22px;
}
.aura{
  position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,
    color-mix(in srgb,var(--aura) 60%,transparent) 0%,
    color-mix(in srgb,var(--aura) 22%,transparent) 42%,
    transparent 70%);
  filter:blur(14px);
  animation:aura-pulse var(--aura-time) ease-in-out infinite;
}
.float{
  position:relative;width:100%;height:100%;
  display:grid;place-items:center;
  animation:float var(--float-time) ease-in-out infinite;
}
.item-img{
  max-width:92%;max-height:92%;object-fit:contain;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--aura) 70%,transparent))
         drop-shadow(0 10px 14px rgba(0,0,0,.45));
  animation:glow var(--aura-time) ease-in-out infinite;
  user-select:none;-webkit-user-drag:none;
}
.item-fallback{
  width:55%;aspect-ratio:1;border:2px dashed rgba(255,255,255,.35);border-radius:18px;
  display:none;place-items:center;text-align:center;padding:10px;
  font-size:12px;color:var(--text-soft);
}
.item-stage.broken .item-img{display:none}
.item-stage.broken .item-fallback{display:grid}

/* sombra en el suelo: se encoge cuando el ítem sube */
.floor-shadow{
  position:absolute;left:27%;bottom:-2px;width:46%;height:16px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);
  filter:blur(4px);
  animation:floor var(--float-time) ease-in-out infinite;
}
@keyframes floor{
  0%,100%{transform:scale(.78);opacity:.45}
  50%{transform:scale(1.05);opacity:.8}
}

/* destellos que suben alrededor del ítem */
.sparks{position:absolute;inset:0;pointer-events:none;overflow:visible}
.spark{
  position:absolute;bottom:18%;width:4px;height:4px;border-radius:50%;
  background:#fff;opacity:0;
  box-shadow:0 0 8px 2px color-mix(in srgb,var(--aura) 80%,#fff);
  animation:spark 4.5s ease-in infinite;
}

@keyframes float{
  0%,100%{transform:translateY(calc(var(--float-distance) * -1)) rotate(-.6deg)}
  50%{transform:translateY(var(--float-distance)) rotate(.6deg)}
}
@keyframes aura-pulse{
  0%,100%{transform:scale(.88);opacity:.65}
  50%{transform:scale(1.08);opacity:1}
}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--aura) 55%,transparent)) drop-shadow(0 10px 14px rgba(0,0,0,.45))}
  50%{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--aura) 95%,transparent)) drop-shadow(0 10px 14px rgba(0,0,0,.45))}
}
@keyframes spark{
  0%{transform:translateY(0) scale(.4);opacity:0}
  15%{opacity:.9}
  100%{transform:translateY(-150px) scale(1);opacity:0}
}

/* ——— Textos ——— */
.item-name{
  font-size:clamp(24px,5.5vw,32px);font-weight:400;letter-spacing:.07em;
  text-transform:uppercase;text-align:center;margin-bottom:26px;
  text-shadow:0 0 28px color-mix(in srgb,var(--aura) 60%,transparent),0 2px 10px rgba(0,0,0,.4);
}
.character{font-size:19px;font-weight:400;margin-top:22px;text-align:center;color:var(--text)}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.meta[hidden]{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  font-size:13px;color:var(--text-soft);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.days{
  color:var(--gold);
  background:color-mix(in srgb,var(--gold) 9%,transparent);
  border-color:color-mix(in srgb,var(--gold) 30%,transparent);
}

/* ——— Barra de progreso con efecto agua ——— */
.bar{
  position:relative;width:var(--bar-width);height:var(--bar-height);
  border-radius:999px;background:var(--bar-track);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 8px 24px color-mix(in srgb,var(--aura) 22%,transparent);
}
.bar::after{ /* brillo de cristal */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 52%);
}
.tip{ /* borde luminoso del agua */
  position:absolute;right:0;top:0;bottom:0;width:22px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6));
}
.bar-fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  border-radius:999px;
  background:linear-gradient(180deg,var(--bar-fill-b),var(--bar-fill-a));
  overflow:hidden;
  transition:width 1.6s cubic-bezier(.22,.8,.25,1);
}
.wave{
  position:absolute;left:0;right:0;top:-2px;height:60%;
  background-repeat:repeat-x;background-size:90px 100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 20' preserveAspectRatio='none'><path d='M0 10 Q22.5 0 45 10 T90 10 V20 H0Z' fill='white'/></svg>");
  opacity:.28;
  animation:wave var(--wave-time) linear infinite;
}
.wave.two{
  top:auto;bottom:-2px;height:55%;
  transform:scaleY(-1);
  opacity:.18;background-size:70px 100%;
  animation-duration:calc(var(--wave-time) * 1.4);animation-direction:reverse;
}
.bar-fill::after{ /* brillo que recorre la barra */
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);
  transform:translateX(-100%);
  animation:sheen 3.8s ease-in-out infinite;
}
.bubble{
  position:absolute;bottom:-8px;border-radius:50%;
  background:rgba(255,255,255,.45);
  animation:bubble linear infinite;
}
.bar-label{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:14px;font-weight:500;letter-spacing:.02em;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  pointer-events:none;z-index:2;
}
@keyframes wave{to{background-position-x:90px}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes bubble{
  0%{transform:translateY(0);opacity:0}
  15%{opacity:.8}
  100%{transform:translateY(-52px);opacity:0}
}

/* ——— Panel de materiales ——— */
.materials{
  width:min(480px,86%);margin-top:56px;
  background:linear-gradient(180deg,#241313,#170b0b);
  border:1px solid color-mix(in srgb,var(--gold) 16%,transparent);
  border-radius:28px;
  padding:26px 28px 28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 44px rgba(0,0,0,.38);
}
.materials h2{font-size:16px;font-weight:500;color:var(--text-soft);margin-bottom:16px;letter-spacing:.01em}
.mat-list{list-style:none;display:grid;gap:2px}
.mat-list li{
  display:flex;justify-content:space-between;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--panel-line);
  font-size:17px;
}
.mat-list li:last-child{border-bottom:0}
.mat-name::before{content:"";display:inline-block;width:6px;height:6px;margin-right:12px;vertical-align:middle;
  background:var(--gold);opacity:.55;transform:rotate(45deg)}
.mat-qty{font-variant-numeric:tabular-nums;color:#e8b86d;font-weight:500}
.mat-image{display:block;width:100%;height:auto;border-radius:16px}
.mat-empty{color:var(--text-soft);font-size:15px}
.mat-message{font-size:18px;line-height:1.5;text-align:center;white-space:pre-line}

/* ——— Puntos de navegación ——— */
.dots{display:flex;gap:10px;margin-top:34px}
.dots button{
  width:9px;height:9px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.28);transition:background .2s,transform .2s;
}
.dots button[aria-current="true"]{background:#fff;transform:scale(1.25)}
.dots button:focus-visible{outline:2px solid #fff;outline-offset:3px}

@media (max-width:480px){
  :root{--item-size:200px}
  .arrow{width:34px;height:52px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<main class="card">
  <div class="viewer" id="viewer">
    <button class="arrow prev" id="prev" aria-label="Objetivo anterior"></button>
    <button class="arrow next" id="next" aria-label="Objetivo siguiente"></button>

    <div class="slide" id="slide" aria-live="polite">
      <div class="halo"></div>
      <div class="item-stage" id="itemStage">
        <div class="floor-shadow"></div>
        <div class="aura"></div>
        <div class="sparks" id="sparks"></div>
        <div class="float">
          <img class="item-img" id="itemImg" alt="">
          <div class="item-fallback" id="itemFallback">Falta la imagen del ítem</div>
        </div>
      </div>

      <h1 class="item-name" id="itemName"></h1>

      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="bar-fill" id="barFill">
          <div class="wave"></div>
          <div class="wave two"></div>
          <div id="bubbles"></div>
          <div class="tip"></div>
        </div>
        <div class="bar-label" id="barLabel">0%</div>
      </div>

      <p class="character" id="character"></p>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <section class="materials" aria-labelledby="matTitle">
    <h2 id="matTitle">Materiales necesarios</h2>
    <div id="matBody"></div>
  </section>

  <nav class="dots" id="dots" aria-label="Objetivos"></nav>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════
   CONFIGURACIÓN  ←  TODO LO QUE TIENES QUE EDITAR ESTÁ AQUÍ
   ══════════════════════════════════════════════════════════════════ */

/* 1) Objetivos (normalmente 2 o 3) */
const TARGETS = [
  {
    item: "Bellion Cestus",
    image: "bc.png",     // PNG con fondo transparente
    character: "CARNICERO",
    startDate: "2026-10-13",            // fecha de inicio: "2026-10-01" o "01/10/2026"
    progress: 90,                       // 0 a 100
    aura: "#6aa8ff",                    // color del brillo y de la barra (opcional)
    message: "Enrias - 83, Recipe 100%",         // texto libre en vez de lista. Ej: "Ya tenemos todo, falta craftear"
    materials: [                        // [id del catálogo, cantidad]
      ["adamantite", 24],
      ["mithril", 18],
      ["oriharukon", 12],
      ["crafted_leather", 40],
      ["varnish", 30]
    ],
    materialsImage: null                // ej: "img/materiales-bow.png"  (si lo pones, sustituye a la lista)
  },
  {
    item: "Black Ore",
    image: "bo.png",
    character: "Narf",
    startDate: "2026-10-11",
    progress: 0,
    aura: "#ff9d5c",
    message: "Por definir",
    materials: [
      ["mithril", 30],
      ["steel", 50],
      ["thread", 60],
      ["stem", 25]
    ],
    materialsImage: null
  },
  /*
  {
    item: "Blue Wolf Heavy Armor",
    image: "bw.png",
    character: "",
    startDate: "2026-10-11",
    progress: 0,
    aura: "#ff9d5c",
    message: null,
    materials: [
        ["stem", 0],
        ["coal", 0],
        ["charcoal", 0],
        ["silver_nugget", 0],
        ["stone_of_purity", 0],
        ["varnish", 0],
        ["animal_bone", 0],
        ["mithril_ore", 0],
        ["asofe", 0],
        ["mold_glue", 0],
        ["mold_lubricant", 0],
        ["iron_ore", 0],
        ["oriharukon_ore", 0],
        ["suede", 0],
        ["animal_skin", 0],
        ["thread", 0],
        ["gemstone_b", 0],
        ["crystal_b", 0],

        // Keys
        ["bw_breastplate_part", 0],
        ["bw_gaiters_material", 0],
        ["bw_gloves_fabric", 0],
        ["bw_boots_design", 0],
        ["bw_helmet_design", 0],

        // Recipes
        ["recipe_bw_breastplate", 0],
        ["recipe_bw_gaiters", 0],
        ["recipe_bw_gloves", 0],
        ["recipe_bw_boots", 0],
        ["recipe_bw_helmet", 0]
    ],
    materialsImage: null
  }
    */
];

/* 2) Catálogo de materiales básicos (id → nombre que se muestra).
      Añade, quita o renombra lo que quieras. */
const MATERIALS_CATALOG = {
  adamantite:      "Adamantite Nugget",
  mithril:         "Mithril Alloy",
  oriharukon:      "Oriharukon Ore",
  steel:           "Steel",
  silver:          "Silver Nugget",
  iron_ore:        "Iron Ore",
  coal:            "Coal",
  charcoal:        "Charcoal",
  animal_bone:     "Animal Bone",
  bone_powder:     "Coarse Bone Powder",
  crafted_leather: "Crafted Leather",
  leather:         "Leather",
  cokes:           "Cokes",
  synthetic_cokes: "Synthetic Cokes",
  varnish:         "Varnish",
  stem:            "Stem",
  thread:          "Thread",
  braided_hemp:    "Braided Hemp",
  compound_braid:  "Compound Braid",
  metallic_fiber:  "Metallic Fiber",
  metallic_thread: "Metallic Thread",
  mold_glue:       "Mold Glue",
  mold_lubricant:  "Mold Lubricant",
  mold_hardener:   "Mold Hardener",
  durable_plate:   "Durable Metal Plate",
  suede:           "High Grade Suede",
  enria:           "Enria",
  asofe:           "Asofe",
  thons:           "Thons"
};

/* 3) Flechas. null = flechas SVG blancas incluidas.
      O pon tu PNG, ej: left: "img/flecha-izq.png"
      (si solo pones la izquierda, la derecha se genera girándola). */
const ARROWS = { left: null, right: null };

/* 4) Opciones */
const OPTIONS = {
  autoRotateSeconds: 0,   // 0 = desactivado; ej. 8 = cambia solo cada 8 s
  transitionMs: 280,      // velocidad del cambio entre objetivos
  showDays: false          // true = junto a la fecha muestra los días que lleva
};

/* ══════════════════════════════════════════════════════════════════
   A partir de aquí no hace falta tocar nada
   ══════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const slide = $("slide"), itemStage = $("itemStage"), itemImg = $("itemImg");
const barFill = $("barFill"), barLabel = $("barLabel"), bar = $("bar");
let index = 0, busy = false, countRaf = 0, autoTimer = 0;

/* flechas (SVG por defecto con la forma de media luna del diseño) */
const arrowSVG = dir => `<svg viewBox="0 0 52 104" aria-hidden="true"><path d="${
  dir === "left" ? "M52 0 L0 52 L52 104 C34 78 34 26 52 0Z" : "M0 0 L52 52 L0 104 C18 78 18 26 0 0Z"}"/></svg>`;
function buildArrow(btn, dir){
  const src = dir === "left" ? ARROWS.left : (ARROWS.right || ARROWS.left);
  if(src){
    btn.innerHTML = `<img src="${src}" alt="" draggable="false">`;
    if(dir === "right" && !ARROWS.right) btn.firstChild.style.transform = "scaleX(-1)";
  } else btn.innerHTML = arrowSVG(dir);
}
buildArrow($("prev"), "left"); buildArrow($("next"), "right");

/* destellos alrededor del ítem */
(function makeSparks(){
  const box = $("sparks");
  for(let i = 0; i < 9; i++){
    const s = document.createElement("span");
    s.className = "spark";
    s.style.left = (18 + Math.random() * 64) + "%";
    s.style.animationDelay = (Math.random() * 4.5).toFixed(2) + "s";
    s.style.animationDuration = (3.4 + Math.random() * 2.4).toFixed(2) + "s";
    box.appendChild(s);
  }
})();

/* burbujas dentro de la barra */
(function makeBubbles(){
  const box = $("bubbles");
  for(let i = 0; i < 10; i++){
    const b = document.createElement("span");
    const size = 3 + Math.random() * 5;
    b.className = "bubble";
    b.style.width = b.style.height = size + "px";
    b.style.left = (Math.random() * 96) + "%";
    b.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
    b.style.animationDuration = (2.4 + Math.random() * 2.6).toFixed(2) + "s";
    box.appendChild(b);
  }
})();

/* puntos de navegación */
const dots = $("dots");
TARGETS.forEach((t, i) => {
  const d = document.createElement("button");
  d.type = "button"; d.setAttribute("aria-label", "Ir a " + t.item);
  d.addEventListener("click", () => goTo(i));
  dots.appendChild(d);
});
if(TARGETS.length < 2){
  $("prev").classList.add("hidden"); $("next").classList.add("hidden"); dots.style.display = "none";
}

/* estrellas tenues del fondo */
(function makeStars(){
  const box = $("stars");
  for(let i = 0; i < 46; i++){
    const s = document.createElement("span"), size = Math.random() < .2 ? 2.5 : 1.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;` +
      `animation-delay:${(Math.random()*6).toFixed(2)}s;animation-duration:${(3+Math.random()*4).toFixed(2)}s`;
    box.appendChild(s);
  }
})();

/* fecha de inicio: acepta "2026-10-01" o "01/10/2026" */
function parseDate(v){
  if(!v) return null;
  v = String(v).trim();
  let m, y, mo, d;
  if((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if((m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))){ d = +m[1]; mo = +m[2]; y = +m[3]; }
  else return null;
  const dt = new Date(y, mo - 1, d);
  return isNaN(dt) ? null : dt;
}
const fmtDate = new Intl.DateTimeFormat("es-ES", {day:"numeric", month:"short", year:"numeric"});
const CAL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5v3M17 2.5v3M3.5 9.5h17M5 4.5h14A1.5 1.5 0 0 1 20.5 6v13a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5Z"/></svg>';

function renderMeta(t){
  const box = $("meta"); box.textContent = "";
  const start = parseDate(t.startDate);
  if(!start){ box.hidden = true; return; }
  box.hidden = false;
  const c1 = document.createElement("span"); c1.className = "chip";
  c1.innerHTML = CAL_ICON;
  const txt = document.createElement("span"); txt.textContent = "Inicio " + fmtDate.format(start);
  c1.appendChild(txt); box.appendChild(c1);
  if(OPTIONS.showDays){
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((today - start) / 864e5);
    const c2 = document.createElement("span"); c2.className = "chip days";
    c2.textContent = diff < 0 ? `En ${-diff} día${diff === -1 ? "" : "s"}`
                   : diff === 0 ? "Hoy"
                   : `${diff} día${diff === 1 ? "" : "s"}`;
    box.appendChild(c2);
  }
}

function renderMaterials(t){
  const body = $("matBody"); body.textContent = "";
  const title = $("matTitle");
  title.textContent = t.panelTitle || "Materiales necesarios";
  title.hidden = false;
  if(t.message){                                   // mensaje libre en vez de lista
    if(!t.panelTitle) title.hidden = true;
    const p = document.createElement("p"); p.className = "mat-message"; p.textContent = t.message;
    body.appendChild(p); return;
  }
  if(t.materialsImage){
    const img = document.createElement("img");
    img.className = "mat-image"; img.src = t.materialsImage; img.alt = "Materiales para " + t.item;
    img.addEventListener("error", () => { body.textContent = ""; const p = document.createElement("p"); p.className = "mat-empty"; p.textContent = "No se encuentra la imagen de materiales."; body.appendChild(p); });
    body.appendChild(img); return;
  }
  if(!t.materials || !t.materials.length){
    const p = document.createElement("p"); p.className = "mat-empty"; p.textContent = "Sin materiales indicados."; body.appendChild(p); return;
  }
  const ul = document.createElement("ul"); ul.className = "mat-list";
  t.materials.forEach(([id, qty]) => {
    const li = document.createElement("li");
    const name = document.createElement("span"); name.className = "mat-name"; name.textContent = MATERIALS_CATALOG[id] || id;
    const q = document.createElement("span"); q.className = "mat-qty"; q.textContent = "x" + qty;
    li.append(name, q); ul.appendChild(li);
  });
  body.appendChild(ul);
}

function setProgress(pct){
  pct = Math.max(0, Math.min(100, Number(pct) || 0));
  bar.setAttribute("aria-valuenow", pct);
  cancelAnimationFrame(countRaf);
  barFill.style.transition = "none"; barFill.style.width = "0%"; barLabel.textContent = "0%";
  void barFill.offsetWidth;                       // reinicia la transición
  barFill.style.transition = ""; barFill.style.width = pct + "%";
  const start = performance.now(), dur = 1600;
  const tick = now => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    barLabel.textContent = Math.round(pct * e) + "%";
    if(p < 1) countRaf = requestAnimationFrame(tick);
  };
  countRaf = requestAnimationFrame(tick);
}

function render(){
  const t = TARGETS[index];
  document.documentElement.style.setProperty("--aura", t.aura || "#6aa8ff");
  itemStage.classList.remove("broken");
  itemImg.onerror = () => itemStage.classList.add("broken");
  itemImg.src = t.image; itemImg.alt = t.item;
  $("itemName").textContent = t.item;
  $("character").textContent = t.character;
  renderMaterials(t);
  renderMeta(t);
  setProgress(t.progress);
  [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === index));
}

async function goTo(i, dir){
  if(busy || i === index) return;
  busy = true;
  dir = dir || (i > index ? 1 : -1);
  const ms = OPTIONS.transitionMs;
  await slide.animate(
    [{opacity:1, transform:"translateX(0)"}, {opacity:0, transform:`translateX(${-40 * dir}px)`}],
    {duration:ms, easing:"ease-in", fill:"forwards"}).finished;
  index = (i + TARGETS.length) % TARGETS.length;
  render();
  await slide.animate(
    [{opacity:0, transform:`translateX(${40 * dir}px)`}, {opacity:1, transform:"translateX(0)"}],
    {duration:ms, easing:"ease-out", fill:"forwards"}).finished;
  slide.getAnimations().forEach(a => a.cancel());
  busy = false;
}
const step = dir => goTo((index + dir + TARGETS.length) % TARGETS.length, dir);

$("prev").addEventListener("click", () => { step(-1); restartAuto(); });
$("next").addEventListener("click", () => { step(1);  restartAuto(); });
document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft"){ step(-1); restartAuto(); }
  if(e.key === "ArrowRight"){ step(1); restartAuto(); }
});

/* deslizar con el dedo en móvil */
let tx = null;
$("viewer").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
$("viewer").addEventListener("touchend", e => {
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 50){ step(dx < 0 ? 1 : -1); restartAuto(); }
});

function restartAuto(){
  clearInterval(autoTimer);
  if(OPTIONS.autoRotateSeconds > 0 && TARGETS.length > 1)
    autoTimer = setInterval(() => step(1), OPTIONS.autoRotateSeconds * 1000);
}

render();
restartAuto();
</script>
</body>
